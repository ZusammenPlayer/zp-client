    <script>
      //const socket = io("http://192.168.178.60:8080");
      const socket = io("http://localhost:8090");

      let currentPlayer = 1;
      let videoPlayer1 = document.getElementById('videoPlayer1'); 
      let videoPlayer2 = document.getElementById('videoPlayer2'); 
      let videoLayer1 = document.getElementById('fsVideo1'); 
      let videoLayer2 = document.getElementById('fsVideo2'); 
      let gameLayer = document.getElementById('dschungel-vis-wrapper'); 
      let imageLayer = document.getElementById('fsImage'); 

      videoPlayer1.volume = 1.0; 
      videoPlayer2.volume = 1.0; 

      function show_videolayer1(){
        videoLayer1.style.display = 'block';
        videoLayer2.style.display = 'none';
        imageLayer.style.display = 'none';
        gameLayer.style.display = 'none';
      }

      function show_videolayer2(){
        videoLayer2.style.display = 'block';
        videoLayer1.style.display = 'none';
        imageLayer.style.display = 'none';
        gameLayer.style.display = 'none';
      }

      if(typeof(ID) != 'undefined'){
        document.getElementById('id').innerHTML=ID;
      }
      function sendMsg() {
        socket.emit("register", JSON.stringify({'type': 'player', 'name': 'helloWorld', 'uid':'1234235676'}));
        socket.emit("message", "HELLO WORLD");
        document.getElementById('status').innerHTML="clicked";
      }
      socket.on("pause", (data) => {
        console.log(data);
        videoPlayer1.pause();
        videoPlayer2.pause();
      });

      socket.on("trigger", (data) => {
        console.log(data);
        if(typeof data !== "undefined"){
          let dataComponents = data.split(" ");
          
          document.getElementById('status').style.display = 'none'; 
  
          if(dataComponents[0] == "playFile"){
            // not used right now
            videoLayer1.style.display = 'none';
            videoLayer2.style.display = 'none';
            imageLayer.style.display = 'none';
            
            document.body.style.backgroundColor = '#ff0000';

          } else if(dataComponents[0] == "preloadVid"){
            if(currentPlayer == 1){
              videoPlayer2.src = "http://localhost:8090/media/file/" + dataComponents[1];
              videoPlayer2.pause();
              videoPlayer2.currentTime = 1;
            } else {
              videoPlayer1.src = "http://localhost:8090/media/file/" + dataComponents[1];
              videoPlayer1.pause();
              videoPlayer1.currentTime = 1;
            }

          } else if(dataComponents[0] == "play"){
            if(currentPlayer == 1){
              videoPlayer2.loop = false;
              videoPlayer1.pause();
              videoPlayer2.play();
              show_videolayer2();
              currentPlayer = 2;
            } else {
              videoPlayer1.loop = false;
              videoPlayer2.pause();
              videoPlayer1.play();
              show_videolayer1();
              currentPlayer = 1;
            }

          } else if(dataComponents[0] == "playVid"){  
            if(currentPlayer == 1){
              if(videoPlayer1.src == "http://localhost:8090/media/file/" + dataComponents[1]){
                videoPlayer1.currentTime = 0;
                videoPlayer1.loop = false;
                show_videolayer1();
                videoPlayer1.play();
              } else {
                if(videoPlayer2.src != "http://localhost:8090/media/file/" + dataComponents[1]){
                  videoPlayer2.src = "http://localhost:8090/media/file/" + dataComponents[1];
                }
                videoPlayer2.loop = false;
                videoPlayer1.pause();
                videoPlayer2.play();
                show_videolayer2();
                currentPlayer = 2;
              }
            } else {
              if(videoPlayer2.src == "http://localhost:8090/media/file/" + dataComponents[1]){
                videoPlayer2.currentTime = 0;
                videoPlayer2.loop = false;
                show_videolayer2();
                videoPlayer2.play();
              } else {
                if(videoPlayer1.src != "http://localhost:8090/media/file/" + dataComponents[1]){
                  videoPlayer1.src = "http://localhost:8090/media/file/" + dataComponents[1];
                }
                videoPlayer1.loop = false;
                videoPlayer2.pause();
                videoPlayer1.play();
                show_videolayer1();
                currentPlayer = 1;
              }
            }

          } else if(dataComponents[0] == "playVidLoop"){
            if(currentPlayer == 1){
              if(videoPlayer1.src == "http://localhost:8090/media/file/" + dataComponents[1]){
                videoPlayer1.currentTime = 0;
                videoPlayer1.loop = true;
                show_videolayer1();
                videoPlayer1.play();
              } else {
                if(videoPlayer2.src != "http://localhost:8090/media/file/" + dataComponents[1]){
                  videoPlayer2.src = "http://localhost:8090/media/file/" + dataComponents[1];
                }
                videoPlayer2.loop = true;
                videoPlayer1.pause();
                videoPlayer2.play();
                show_videolayer2();
                currentPlayer = 2;
              }
            } else {
              if(videoPlayer2.src == "http://localhost:8090/media/file/" + dataComponents[1]){
                videoPlayer2.currentTime = 0;
                videoPlayer2.loop = true;
                show_videolayer2();
                videoPlayer2.play();
              } else {
                if(videoPlayer1.src != "http://localhost:8090/media/file/" + dataComponents[1]){
                  videoPlayer1.src = "http://localhost:8090/media/file/" + dataComponents[1];
                }
                videoPlayer1.loop = true;
                videoPlayer2.pause();
                videoPlayer1.play();
                show_videolayer1();
                currentPlayer = 1;
              }
            }

          } else if(dataComponents[0] == "pause"){
            videoPlayer1.pause();
            videoPlayer2.pause();
          } else if(dataComponents[0] == "stop"){
            
            videoPlayer1.pause();
            videoPlayer1.currentTime = 0;
         
            videoPlayer2.pause();
            videoPlayer2.currentTime = 0;
          

          } else if(dataComponents[0] == "black"){
            videoLayer1.style.display = 'none';
              videoLayer2.style.display = 'none';
              imageLayer.style.display = 'none';
              gameLayer.style.display = 'none';
              document.body.style.backgroundColor = '#000000';
              videoPlayer1.pause();
              //videoPlayer1.currentTime = 0;
          
              videoPlayer2.pause();
              //videoPlayer2.currentTime = 0;
            

          } else if(dataComponents[0] == "rewind"){
            if(currentPlayer == 1){
              videoPlayer1.currentTime = 0;
            } else {
              videoPlayer2.currentTime = 0;
            }

          } else if(dataComponents[0] == "show"){
            videoLayer1.style.display = 'none';
            videoLayer2.style.display = 'none';
            gameLayer.style.display = 'none';
            imageLayer.style.display = 'block';
            
            imageLayer.style.backgroundImage="url('" + "http://localhost:8090/media/file/" + dataComponents[1] + "')";
              
          } else if(dataComponents[0] == "bg"){
              videoLayer1.style.display = 'none';
              videoLayer2.style.display = 'none';
              imageLayer.style.display = 'none';
              gameLayer.style.display = 'none';
              
              document.body.style.backgroundColor = dataComponents[1];

          } else if(dataComponents[0] == "view"){
              if(dataComponents[1] == 'bg'){
                videoLayer1.style.display = 'none';
                videoLayer2.style.display = 'none';
                imageLayer.style.display = 'none';
                gameLayer.style.display = 'none';
              } else if (dataComponents[1] == 'video'){
                if(currentPlayer == 1){
                  videoLayer1.style.display = 'block';
                } else {
                  videoLayer2.style.display = 'block';
                }
                gameLayer.style.display = 'none';
                imageLayer.style.display = 'none';
              } else if (dataComponents[1] == 'image'){
                videoLayer1.style.display = 'none';
                videoLayer2.style.display = 'none';
                gameLayer.style.display = 'none';
                imageLayer.style.display = 'block';
              } 
              
          } else if(dataComponents[0] == "pause"){
            videoPlayer1.pause();
            videoPlayer2.pause();
          } else if(dataComponents[0] == "game-on"){
            gameLayer.style.display = 'flex';
          } else if(dataComponents[0] == "game-off"){
            gameLayer.style.display = 'none';
          }
        }
      })
      
      socket.on("connect", () => {  
        if(socket.connected){
          //socket.emit("register", {'type': 'player', 'name': 'Raspi Player', 'uid':ID}); 
          document.getElementById("status").innerHTML="verbunden";
        }else{
          document.getElementById("status").innerHTML="nicht verbunden";
        }
      }); // true});
      socket.on("disconnect", () => {  
        if(socket.connected){
          document.getElementById("status").innerHTML="verbunden";
        }else{
          document.getElementById("status").innerHTML="nicht verbunden";
        }
      }); // false});
    </script>
    <script>
      const brokerHost = "brain.local";
      const brokerPort = 8083;
      const mqttUser = "everyuser";
      const mqttPassword = "everyheart25";
      const baseTopic = "every/objects/dschungel";
      const chargeLevelTopic = `${baseTopic}/charge_level`;
      const roundTopic = `${baseTopic}/round`;

      const client = mqtt.connect(`ws://${brokerHost}:${brokerPort}`, {
          username: mqttUser,
          password: mqttPassword,
      });

      client.on("connect", () => {
          console.log("Connected to MQTT broker");
          client.subscribe(chargeLevelTopic, (err) => {
              if (err) {
                  console.error("Subscription error", err);
              }
          });
          client.subscribe(roundTopic, (err) => {
              if (err) {
                  console.error("Subscription error", err);
              }
          });
      });

      client.on("message", (receivedTopic, message) => {
          if (receivedTopic === chargeLevelTopic) {
              let chargeLevel = parseInt(message.toString());
              if (!isNaN(chargeLevel)) {
                  chargeLevel = Math.max(0, Math.min(100, chargeLevel));
                  const batteryLevelElement =
                      document.getElementById("battery-level");
                  batteryLevelElement.style.transition =
                      "width 0.5s ease-in-out, background-color 0.5s ease-in-out";
                  batteryLevelElement.style.width = chargeLevel + "%";

                  // Non-linear color gradient transition
                  let dim = 128;
                  let per = 75;
                  let red, green;
                  if (chargeLevel < 75) {
                      red = dim;
                      green = Math.round(dim * (chargeLevel / per));
                  } else if (chargeLevel < 100) {
                      red = Math.round(
                          dim * ((100 - chargeLevel) / 100 - per),
                      );
                      green = dim;
                  } else {
                      red = 0;
                      green = 255;
                  }
                  batteryLevelElement.style.backgroundColor = `rgb(${red}, ${green}, 0)`;
              }
          }
          if (receivedTopic === roundTopic) {
              let round = parseInt(message.toString());
              if (!isNaN(round)) {
                  document.getElementById("round-value").innerText =
                      round;
              }
          }
      });
  </script>
